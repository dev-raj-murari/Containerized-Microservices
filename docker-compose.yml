version: '3.8'

services:
  api-gateway:
    build:
      context: .
      dockerfile: services/api_gateway/Dockerfile
    container_name: api-gateway
    ports:
      - "8000:8000"
    environment:
      - USER_SERVICE_URL=http://user-service:8001
      - ORDER_SERVICE_URL=http://order-service:8002
    depends_on:
      - user-service
      - order-service
    networks:
      - microservices-net
    restart: always

  user-service:
    build:
      context: .
      dockerfile: services/user_service/Dockerfile
    container_name: user-service
    ports:
      - "8001:8001"
    environment:
      - PORT=8001
    networks:
      - microservices-net
    restart: always

  order-service:
    build:
      context: .
      dockerfile: services/order_service/Dockerfile
    container_name: order-service
    ports:
      - "8002:8002"
    environment:
      - PORT=8002
    networks:
      - microservices-net
    restart: always

networks:
  microservices-net:
    driver: bridge
