name: Microservices CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Run Unit & Integration Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Test Suite with Pytest
        env:
          PYTHONPATH: .
        run: |
          pytest -v --tb=short

  build-containers:
    name: Build Docker Images Verification
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Gateway Image
        run: docker build -t microservices-gateway:latest -f services/api_gateway/Dockerfile .

      - name: Build User Service Image
        run: docker build -t microservices-user:latest -f services/user_service/Dockerfile .

      - name: Build Order Service Image
        run: docker build -t microservices-order:latest -f services/order_service/Dockerfile .
